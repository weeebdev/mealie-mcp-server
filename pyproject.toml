[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mealie-mcp-server"
version = "0.1.0"
description = "MCP server for Mealie recipe manager - search, create, and manage recipes, shopping lists, and meal plans via the Model Context Protocol."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "weeebdev" }]
license = { text = "MIT" }
keywords = ["mealie", "mcp", "model-context-protocol", "recipes"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.12.0",
    "pydantic>=2.11.3",
    "python-dotenv>=1.1.0",
]

[project.scripts]
mealie-mcp-server = "server:main"

[tool.hatch.build.targets.wheel]
only-include = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[project.optional-dependencies]
dev = ["black>=24.1.0", "isort>=5.13.0"]
